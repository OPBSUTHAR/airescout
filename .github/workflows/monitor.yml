name: Air Quality Endpoint Health

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Open-Meteo AQI endpoint
        id: probe
        run: |
          set +e
          RESP=$(curl -sS -m 20 "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=28.6139&longitude=77.2090&current=us_aqi&timezone=Asia%2FKolkata")
          echo "$RESP"
          if echo "$RESP" | grep -q '"us_aqi"'; then
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "ok=false" >> $GITHUB_OUTPUT
          fi
      - name: Open issue on failure
        if: steps.probe.outputs.ok != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Daily AQI endpoint health check failed",
              body: "The Open-Meteo air-quality endpoint did not return a valid reading.\n\nProbe run: ${{ github.run_id }}",
              labels: ["monitoring", "bug"]
            });
            core.info(`Opened issue #${data.number}`);